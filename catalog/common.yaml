---
#include /includes/agd-v2-mapping.yaml
#include /includes/catalog-icon-rh-ai-2025.yaml
#include /includes/terms-of-service.yaml
#include /includes/sandbox-api.yaml
#include /includes/parameters/purpose.yaml

config: openshift-workloads
cloud_provider: none
openshift_cnv_scale_cluster: false
num_users: 1

clusters:
  - default:
      api_url: "{{ openshift_api_url }}"
      api_token: "{{ openshift_cluster_admin_token }}"

tag: main
requirements_content:
  collections:
    - name: https://github.com/rhpds/core_workloads.git
      type: git
      version: "{{ tag }}"
    - name: https://github.com/rhpds/showroom.git
      type: git
      version: v1.7.2
    - name: https://github.com/jkershawrh/showroom-praxis-ai-gateway.git#/automation/ansible
      type: git
      version: "{{ tag }}"

workloads:
  - agnosticd.core_workloads.ocp4_workload_authentication
  - praxis_ai_gateway.automation.configure_praxis
  - agnosticd.core_workloads.ocp4_workload_openshift_gitops
  - agnosticd.core_workloads.ocp4_workload_gitops_bootstrap
  - agnosticd.showroom.ocp4_workload_ocp_console_embed
  - agnosticd.showroom.ocp4_workload_showroom

remove_workloads:
  - agnosticd.showroom.ocp4_workload_showroom
  - agnosticd.core_workloads.ocp4_workload_gitops_bootstrap
  - praxis_ai_gateway.automation.configure_praxis

common_password: >-
  {{ lookup('password', output_dir ~ '/common_password', length=12, chars=['ascii_letters', 'digits']) }}
praxis_oauth_cookie_secret: >-
  {{ lookup('password', output_dir ~ '/praxis_oauth_cookie_secret', length=43, chars=['ascii_letters', 'digits']) }}

# Red Hat Build of Keycloak authentication for OpenShift lab users.
ocp4_workload_authentication_provider: keycloak
ocp4_workload_authentication_namespace: keycloak
ocp4_workload_authentication_channel: stable-v26.4
ocp4_workload_authentication_use_catalog_source: false
ocp4_workload_authentication_admin_create: true
ocp4_workload_authentication_admin_username: admin
ocp4_workload_authentication_admin_password: "{{ common_password }}"
ocp4_workload_authentication_num_users: "{{ num_users | int }}"
ocp4_workload_authentication_user_username_base: user
ocp4_workload_authentication_user_password: "{{ common_password }}"
ocp4_workload_authentication_remove_kubeadmin: true

# MaaS is a replaceable OpenAI-compatible backend. Values go directly from the
# sandbox credential into the custom workload and never into Showroom user data.
praxis_lab_namespace: "praxis-ai-gateway-{{ guid }}"
praxis_model_base_url: "{{ maas_sandbox.credentials[0].api_base_url }}"
praxis_model_api_key: "{{ maas_sandbox.credentials[0].virtual_key }}"
praxis_model_name: "{{ maas_sandbox.credentials[0].available_models[0] }}"

# OpenShift GitOps.
ocp4_workload_openshift_gitops_channel: gitops-1.19
ocp4_workload_openshift_gitops_use_catalog_snapshot: false
ocp4_workload_openshift_gitops_setup_cluster_admin: true
ocp4_workload_openshift_gitops_update_route_tls: true
ocp4_workload_openshift_gitops_rbac_update: true
ocp4_workload_openshift_gitops_rbac_policy: |
  g, system:cluster-admins, role:admin
  g, admin, role:admin
ocp4_workload_openshift_gitops_rbac_scopes: '[name,groups]'

# No credentials are placed in the Argo CD Application or Helm parameters.
ocp4_workload_gitops_bootstrap_repo_url: https://github.com/jkershawrh/showroom-praxis-ai-gateway
ocp4_workload_gitops_bootstrap_repo_revision: main
ocp4_workload_gitops_bootstrap_repo_path: automation/gitops/bootstrap-infra
ocp4_workload_gitops_bootstrap_application_name: "praxis-bootstrap-{{ guid }}"
ocp4_workload_gitops_bootstrap_helm_values:
  guid: "{{ guid }}"
  repo:
    url: https://github.com/jkershawrh/showroom-praxis-ai-gateway
    revision: main
  praxis:
    model: "{{ maas_sandbox.credentials[0].available_models[0] }}"
    uiImage: quay.io/redhat-gpte/praxis-ai-gateway-ui@sha256:e67615e04af243e2f06d7450f2a1b776c4ac07ebd75c1250a7b7f1f36d694e53

# Showroom intentionally receives no MaaS endpoint or credential.
ocp4_workload_showroom_namespace: "showroom-{{ guid }}"
ocp4_workload_showroom_content_git_repo: https://github.com/jkershawrh/showroom-praxis-ai-gateway
ocp4_workload_showroom_content_git_repo_ref: main
ocp4_workload_showroom_chart_package_url: https://rhpds.github.io/showroom-deployer
ocp4_workload_showroom_deployer_chart_name: showroom-single-pod
ocp4_workload_showroom_terminal_image: quay.io/rhpds/openshift-showroom-terminal-ocp:2026-03-11
ocp4_workload_showroom_passthrough_user_data: true
ocp4_workload_showroom_user_data:
  openshift_api_url: "{{ openshift_api_url }}"
  openshift_console_url: "https://console-openshift-console.{{ openshift_cluster_ingress_domain }}"
  project_name: "{{ praxis_lab_namespace }}"
  praxis_model: "{{ maas_sandbox.credentials[0].available_models[0] }}"
  user: user1
  password: "{{ common_password }}"

__meta__:
  asset_uuid: f8eae1e2-4919-4b2a-9bba-03c28325e2bf
  owners:
    maintainer:
      - name: John Kershaw
        email: jkershaw@redhat.com
    instructions:
      - name: John Kershaw
        email: jkershaw@redhat.com
  sandboxes:
    - kind: MaaSSandbox
      cloud_selector:
        purpose: production
      models: granite-3-2-8b-instruct
      var: maas_sandbox
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: "Govern AI Model Access with Praxis"
    category: Labs
    multiuser: false
    workshop_user_mode: single
    keywords:
      - ai-gateway
      - governance
      - praxis
      - openshift
      - intel
    labels:
      Product: Red_Hat_AI
      Product_Family: Red_Hat_Cloud
      Provider: RHDP
    reportingLabels:
      primaryBU: Hybrid_Platforms
    parameters:
      - name: num_users
        description: Number of lab users to provision.
        formLabel: OpenShift User Count
        openAPIV3Schema:
          type: integer
          default: 1
          minimum: 1
          maximum: 1
  components:
    - name: openshift
      display_name: OpenShift Cluster on the Intel-backed ocpv09 CNV pool
      item: agd-v2/ocp-cluster-cnv-pools
      parameter_values:
        cluster_size: multinode
        host_ocp4_installer_version: "4.20"
      propagate_provision_data:
        - name: openshift_api_ca_cert
          var: openshift_api_ca_cert
        - name: openshift_api_url
          var: openshift_api_url
        - name: openshift_cluster_admin_token
          var: openshift_api_key
        - name: openshift_cluster_admin_token
          var: openshift_cluster_admin_token
        - name: openshift_cluster_ingress_domain
          var: openshift_cluster_ingress_domain
  deployer:
    scm_url: https://github.com/rhpds/agnosticd-v2
    scm_ref: main
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:chained-2026-07-07
      pull: missing
    actions:
      destroy:
        disable: false
      start:
        disable: false
      status:
        disable: true
      stop:
        disable: false
      update:
        disable: true
