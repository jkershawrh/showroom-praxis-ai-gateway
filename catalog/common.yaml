---
#include /includes/agd-v2-mapping.yaml
#include /includes/catalog-icon-rh-ai-2025.yaml
#include /includes/terms-of-service.yaml
#include /includes/sandbox-api.yaml
#include /includes/parameters/purpose.yaml
#include /includes/access-restriction-quickstarts-ai.yaml
#include /includes/secrets/litemaas-master_api.yaml
#include /includes/parameters/litellm_metadata.yaml

config: namespace
cloud_provider: none

tag: main
requirements_content:
  collections:
    - name: https://github.com/rhpds/namespaced_workloads.git
      type: git
      version: "{{ tag }}"
    - name: https://github.com/rhpds/core_workloads.git
      type: git
      version: "{{ tag }}"
    - name: https://github.com/rhpds/showroom.git
      type: git
      version: v1.7.2
    - name: https://github.com/rhpds/rhpds.litellm_virtual_keys.git
      type: git
      version: "{{ tag }}"
    - name: https://github.com/jkershawrh/showroom-praxis-ai-gateway.git#/automation/ansible
      type: git
      version: "{{ tag }}"

workloads:
  - agnosticd.namespaced_workloads.ocp4_workload_tenant_keycloak_user
  - agnosticd.namespaced_workloads.ocp4_workload_tenant_namespace
  - rhpds.litellm_virtual_keys.ocp4_workload_litellm_virtual_keys
  - praxis_ai_gateway.automation.configure_praxis
  - agnosticd.core_workloads.ocp4_workload_gitops_bootstrap
  - agnosticd.showroom.ocp4_workload_showroom

remove_workloads:
  - agnosticd.showroom.ocp4_workload_showroom
  - agnosticd.core_workloads.ocp4_workload_gitops_bootstrap
  - praxis_ai_gateway.automation.configure_praxis
  - rhpds.litellm_virtual_keys.ocp4_workload_litellm_virtual_keys
  - agnosticd.namespaced_workloads.ocp4_workload_tenant_namespace
  - agnosticd.namespaced_workloads.ocp4_workload_tenant_keycloak_user

common_password: >-
  {{ lookup('password', output_dir ~ '/common_password', length=12, chars=['ascii_letters', 'digits']) }}
praxis_oauth_cookie_secret: >-
  {{ lookup('password', output_dir ~ '/praxis_oauth_cookie_secret', length=43, chars=['ascii_letters', 'digits']) }}

# Tenant identity and namespace on the registered Intel Inference cluster.
ocp4_workload_tenant_keycloak_username: "user-{{ guid }}"
ocp4_workload_tenant_keycloak_user_password: "{{ common_password }}"
ocp4_workload_tenant_keycloak_user_keycloak_namespace: keycloak
ocp4_workload_tenant_keycloak_user_keycloak_realm: sso

ocp4_workload_tenant_namespace_username: "user-{{ guid }}"
ocp4_workload_tenant_namespace_use_cluster_quota: true
ocp4_workload_tenant_namespace_suffixes:
  - suffix: praxis
ocp4_workload_tenant_namespace_default_quota:
  limits.cpu: "4"
  requests.cpu: "4"
  limits.memory: 8Gi
  requests.memory: 8Gi
  requests.storage: 5Gi
ocp4_workload_tenant_namespace_default_limit_range:
  default:
    cpu: "1"
    memory: 2Gi
  defaultRequest:
    cpu: 100m
    memory: 256Mi

# LiteMaaS is a replaceable OpenAI-compatible backend. AgnosticV creates a
# per-order virtual key, then passes it directly to the custom workload. The
# endpoint and credential never enter Showroom user data or GitOps values.
praxis_model_name: granite-3-2-8b-instruct
ocp4_workload_litellm_virtual_keys_duration: "7d"
ocp4_workload_litellm_virtual_keys_models:
  - "{{ praxis_model_name }}"
ocp4_workload_litellm_virtual_keys_enable_user_info_messages: false
ocp4_workload_litellm_virtual_keys_enable_user_info_data: false

praxis_lab_namespace: "user-{{ guid }}-praxis"
praxis_model_base_url: "{{ litellm_api_endpoint }}/v1"
praxis_model_api_key: "{{ litellm_virtual_key }}"

# The shared cluster already provides OpenShift GitOps. No credentials are
# placed in the Argo CD Application or Helm parameters.
ocp4_workload_gitops_bootstrap_repo_url: https://github.com/jkershawrh/showroom-praxis-ai-gateway
ocp4_workload_gitops_bootstrap_repo_revision: main
ocp4_workload_gitops_bootstrap_repo_path: automation/gitops/bootstrap-infra
ocp4_workload_gitops_bootstrap_application_name: "praxis-bootstrap-{{ guid }}"
ocp4_workload_gitops_bootstrap_helm_values:
  guid: "{{ guid }}"
  namespace: "{{ praxis_lab_namespace }}"
  repo:
    url: https://github.com/jkershawrh/showroom-praxis-ai-gateway
    revision: main
  praxis:
    model: "{{ praxis_model_name }}"
    uiImage: quay.io/redhat-gpte/praxis-ai-gateway-ui@sha256:e67615e04af243e2f06d7450f2a1b776c4ac07ebd75c1250a7b7f1f36d694e53

# Showroom intentionally receives no MaaS endpoint or credential.
openshift_api_url: "{{ sandbox_openshift_api_url }}"
openshift_cluster_admin_token: "{{ cluster_admin_agnosticd_sa_token }}"
ocp4_workload_showroom_namespace: "user-{{ guid }}-showroom"
ocp4_workload_showroom_content_git_repo: https://github.com/jkershawrh/showroom-praxis-ai-gateway
ocp4_workload_showroom_content_git_repo_ref: main
ocp4_workload_showroom_chart_package_url: https://rhpds.github.io/showroom-deployer
ocp4_workload_showroom_deployer_chart_name: showroom-single-pod
ocp4_workload_showroom_terminal_image: quay.io/rhpds/openshift-showroom-terminal-ocp:2026-03-11
ocp4_workload_showroom_passthrough_user_data: true
ocp4_workload_showroom_user_data:
  openshift_api_url: "{{ sandbox_openshift_api_url }}"
  openshift_console_url: "https://console-openshift-console.{{ openshift_cluster_ingress_domain }}"
  project_name: "{{ praxis_lab_namespace }}"
  praxis_model: "{{ praxis_model_name }}"
  user: "user-{{ guid }}"
  password: "{{ common_password }}"

__meta__:
  asset_uuid: f8eae1e2-4919-4b2a-9bba-03c28325e2bf
  sandbox_api:
    actions:
      destroy:
        catch_all: false
  owners:
    maintainer:
      - name: John Kershaw
        email: jkershaw@redhat.com
    instructions:
      - name: John Kershaw
        email: jkershaw@redhat.com
  catalog:
    namespace: babylon-catalog-{{ stage | default('?') }}
    display_name: "Govern AI Model Access with Praxis"
    category: Labs
    multiuser: false
    # Provision data is assigned directly to this single tenant's workshop seat.
    # Babylon treats any value other than "none" as multiuserServices: true.
    workshop_user_mode: none
    keywords:
      - ai-gateway
      - governance
      - praxis
      - openshift
    labels:
      Product: Red_Hat_AI
      Product_Family: Red_Hat_Cloud
      Provider: RHDP
    reportingLabels:
      primaryBU: Hybrid_Platforms
    parameters: []
  deployer:
    scm_url: https://github.com/rhpds/agnosticd-v2
    scm_ref: main
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:chained-2026-07-07
      pull: missing
    actions:
      destroy:
        disable: false
      start:
        disable: false
      status:
        disable: true
      stop:
        disable: false
      update:
        disable: true
