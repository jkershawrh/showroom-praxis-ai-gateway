name: Validate Showroom lab

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  showroom:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install 'PyYAML>=6,<7' 'ansible-core>=2.15,<2.20'
      - run: python runtime-automation/validate_lab.py
      - name: Validate custom Ansible collection
        run: |
          ansible-galaxy collection install ./automation/ansible --force
          ansible-playbook --syntax-check automation/ansible/playbooks/setup.yml
      - name: Validate GitOps charts
        run: |
          helm lint automation/gitops/praxis
          helm lint automation/gitops/bootstrap-infra
          helm template praxis automation/gitops/praxis > /tmp/praxis-rendered.yaml
          helm template bootstrap automation/gitops/bootstrap-infra > /tmp/praxis-bootstrap-rendered.yaml
          python - <<'PY'
          import yaml
          for path in ["/tmp/praxis-rendered.yaml", "/tmp/praxis-bootstrap-rendered.yaml"]:
              with open(path) as stream:
                  documents = list(yaml.safe_load_all(stream))
              assert documents and all(isinstance(item, dict) for item in documents), path
          PY
      - name: Build Antora site
        run: >-
          npx --yes
          --package @antora/cli@3.1.14
          --package @antora/site-generator@3.1.14
          antora --fetch default-site.yml
