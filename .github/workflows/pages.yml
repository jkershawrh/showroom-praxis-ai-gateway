name: Publish Showroom preview

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build the standalone Showroom preview
        run: >-
          npx --yes
          --package @antora/cli@3.1.14
          --package @antora/site-generator@3.1.14
          antora --fetch default-site.yml

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: www

      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
