approach: both

infrastructure:
  type: ocp-cnv
  ocp_version: "4.20"
  multi_user: false
  users_per_deployment: 1
  pool: unpinned

operators:
  - Red Hat OpenShift GitOps
  - Red Hat Build of Keycloak

applications:
  - Praxis AI Gateway
  - Authenticated Praxis learner UI
  - Showroom

rbac:
  - OpenShift OAuth protects the learner UI
  - Learners receive namespace-scoped access

seed_data: []
network:
  - Default deny for Praxis lab workloads
  - OpenShift ingress to the OAuth proxy only
  - Learner UI to Praxis only
  - Praxis egress to HTTPS model backends and DNS only
broken_resources: []
provision_data:
  - litellm_api_endpoint
  - litellm_virtual_key
notes: >-
  The standard RHDP LiteMaaS virtual-key workload owns per-order key creation
  and cleanup. MaaS is a replaceable backend necessitated by the shared lab
  platform. Its credential is written directly to an OpenShift Secret and is
  not passed into Showroom user data or GitOps Helm values.
