entries:
  - date: "2026-09-10"
    stage: integration
    summary: >-
      Injected the rendered Showroom UI configuration from AgnosticV and aligned
      its terminal route with the deployed OpenShift terminal, preventing the
      Nookbag "Port and url not defined" startup error.
  - date: "2026-09-10"
    stage: integration
    summary: >-
      Set workshop_user_mode to none so Babylon creates a single-tenant service
      and assigns provision data directly instead of enabling multiuser services.
  - date: "2026-09-10"
    stage: integration
    summary: >-
      Corrected the Dev Sandbox API selector to the live registered pool label
      ai-lab-xeon6-inference after the first order exposed the stale draft label.
  - date: "2026-09-10"
    stage: integration
    summary: >-
      Converted Praxis from a per-order cluster component to a tenant CI on the
      registered ai-qs-intel-inference shared cluster. Dev selection uses the
      same cnv-dedicated-shared lab label as the Intel Inference tenant CI.
  - date: "2026-09-10"
    stage: integration
    summary: >-
      Aligned the common and dev CI shape with the AI Agent base CI and removed
      physical CNV pool pinning. Integration now uses the reusable generic
      agd-v2/ocp-cluster-cnv-pools component.
  - date: "2026-09-10"
    stage: validation
    summary: >-
      Replaced the unverified sandbox contract with the established RHDP
      LiteMaaS virtual-key collection and lifecycle used by current AI
      Quickstarts. Kept endpoint and key material out of Showroom and GitOps.
  - date: "2026-09-10"
    stage: development
    summary: >-
      Added Publishing House project specification, initial CNV target, secure MaaS
      secret flow, custom Ansible automation, GitOps deployment, and validation.
