apiVersion: apps/v1
kind: Deployment
metadata:
  name: praxis-ai
  namespace: {{ .Values.namespace | quote }}
  labels:
    app.kubernetes.io/name: praxis-ai
    app.kubernetes.io/part-of: praxis-ai-gateway-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: praxis-ai
  template:
    metadata:
      labels:
        app.kubernetes.io/name: praxis-ai
        app.kubernetes.io/part-of: praxis-ai-gateway-lab
      annotations:
        praxis-lab.redhat.com/backend-profile: rhdp-maas
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: praxis-ai
          image: {{ .Values.images.praxis | quote }}
          imagePullPolicy: IfNotPresent
          args: ["--config", "/etc/praxis/praxis-ai.yaml"]
          env:
            - name: MODEL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: model-backend-credentials
                  key: api-key
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            exec:
              command: ["wget", "-qO-", "http://127.0.0.1:9901/healthy"]
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["wget", "-qO-", "http://127.0.0.1:9901/healthy"]
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/praxis/praxis-ai.yaml
              subPath: praxis-ai.yaml
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: praxis-ai-config
---
apiVersion: v1
kind: Service
metadata:
  name: praxis-ai
  namespace: {{ .Values.namespace | quote }}
  labels:
    app.kubernetes.io/name: praxis-ai
    app.kubernetes.io/part-of: praxis-ai-gateway-lab
spec:
  selector:
    app.kubernetes.io/name: praxis-ai
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: praxis-ui
  namespace: {{ .Values.namespace | quote }}
  annotations:
    serviceaccounts.openshift.io/oauth-redirectreference.primary: >-
      {"kind":"OAuthRedirectReference","apiVersion":"v1","reference":{"kind":"Route","name":"praxis-ui"}}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: praxis-ui-auth-delegator
  namespace: {{ .Values.namespace | quote }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: praxis-ui
    namespace: {{ .Values.namespace | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: praxis-ui
  namespace: {{ .Values.namespace | quote }}
  labels:
    app.kubernetes.io/name: praxis-ui
    app.kubernetes.io/part-of: praxis-ai-gateway-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: praxis-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: praxis-ui
        app.kubernetes.io/part-of: praxis-ai-gateway-lab
    spec:
      serviceAccountName: praxis-ui
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: praxis-ui
          image: {{ .Values.images.ui | quote }}
          imagePullPolicy: IfNotPresent
          env:
            - name: PRAXIS_BASE_URL
              value: http://praxis-ai:8080
            - name: PRAXIS_MODEL
              value: {{ .Values.model | quote }}
          ports:
            - name: ui-http
              containerPort: 7860
          readinessProbe:
            httpGet:
              path: /
              port: ui-http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
          securityContext: &restrictedSecurity
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
        - name: oauth-proxy
          image: {{ .Values.images.oauthProxy | quote }}
          imagePullPolicy: IfNotPresent
          args:
            - --https-address=:8443
            - --provider=openshift
            - --openshift-service-account=praxis-ui
            - --upstream=http://127.0.0.1:7860
            - --tls-cert=/etc/tls/private/tls.crt
            - --tls-key=/etc/tls/private/tls.key
            - --cookie-secret-file=/etc/proxy/secrets/session_secret
            - --email-domain=*
          ports:
            - name: oauth
              containerPort: 8443
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext: *restrictedSecurity
          volumeMounts:
            - name: proxy-tls
              mountPath: /etc/tls/private
              readOnly: true
            - name: proxy-cookie
              mountPath: /etc/proxy/secrets
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: proxy-tls
          secret:
            secretName: praxis-ui-tls
        - name: proxy-cookie
          secret:
            secretName: praxis-ui-proxy-cookie
---
apiVersion: v1
kind: Service
metadata:
  name: praxis-ui
  namespace: {{ .Values.namespace | quote }}
  labels:
    app.kubernetes.io/name: praxis-ui
    app.kubernetes.io/part-of: praxis-ai-gateway-lab
  annotations:
    service.beta.openshift.io/serving-cert-secret-name: praxis-ui-tls
spec:
  selector:
    app.kubernetes.io/name: praxis-ui
  ports:
    - name: https
      port: 443
      targetPort: oauth
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: praxis-ui
  namespace: {{ .Values.namespace | quote }}
  labels:
    app.kubernetes.io/name: praxis-ui
    app.kubernetes.io/part-of: praxis-ai-gateway-lab
spec:
  to:
    kind: Service
    name: praxis-ui
  port:
    targetPort: https
  tls:
    termination: reencrypt
    insecureEdgeTerminationPolicy: Redirect
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: praxis-lab-default-deny
  namespace: {{ .Values.namespace | quote }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: praxis-ai-gateway-lab
  policyTypes: ["Ingress", "Egress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: praxis-ai-allow-required-traffic
  namespace: {{ .Values.namespace | quote }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: praxis-ai
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: praxis-ui
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - ports:
        - protocol: TCP
          port: 443
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: praxis-ui-allow-required-traffic
  namespace: {{ .Values.namespace | quote }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: praxis-ui
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              network.openshift.io/policy-group: ingress
      ports:
        - protocol: TCP
          port: 8443
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: praxis-ai
      ports:
        - protocol: TCP
          port: 8080
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
