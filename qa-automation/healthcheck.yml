---
- name: Check the provisioned Praxis lab without exposing credentials
  hosts: localhost
  gather_facts: false
  vars:
    praxis_lab_namespace: "praxis-ai-gateway-{{ guid }}"
  tasks:
    - name: Read Praxis deployment
      kubernetes.core.k8s_info:
        api_version: apps/v1
        kind: Deployment
        name: praxis-ai
        namespace: "{{ praxis_lab_namespace }}"
      register: praxis_deployment

    - name: Read learner UI deployment
      kubernetes.core.k8s_info:
        api_version: apps/v1
        kind: Deployment
        name: praxis-ui
        namespace: "{{ praxis_lab_namespace }}"
      register: praxis_ui_deployment

    - name: Read protected learner route
      kubernetes.core.k8s_info:
        api_version: route.openshift.io/v1
        kind: Route
        name: praxis-ui
        namespace: "{{ praxis_lab_namespace }}"
      register: praxis_ui_route

    - name: Assert runtime availability and re-encrypt TLS
      ansible.builtin.assert:
        that:
          - praxis_deployment.resources | length == 1
          - praxis_deployment.resources[0].status.availableReplicas | default(0) | int == 1
          - praxis_ui_deployment.resources | length == 1
          - praxis_ui_deployment.resources[0].status.availableReplicas | default(0) | int == 1
          - praxis_ui_route.resources | length == 1
          - praxis_ui_route.resources[0].spec.tls.termination == 'reencrypt'

    - name: Confirm the backend credential Secret exists
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        name: model-backend-credentials
        namespace: "{{ praxis_lab_namespace }}"
      register: backend_secret
      no_log: true

    - name: Assert the credential is platform managed
      ansible.builtin.assert:
        that:
          - backend_secret.resources | length == 1
          - backend_secret.resources[0].data['api-key'] | default('') | length > 0
      no_log: true
